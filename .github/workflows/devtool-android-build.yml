# Debug-only GitHub build dispatch compatible with Devtool ACTIONS-05.
# This workflow does not consume signing credentials or publish releases.
name: Telegram Speed Hook Devtool Android Build
on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: 'Checked-in project root'
        required: true
        type: choice
        default: '.'
        options: ['.']
      module:
        description: 'Single checked-in Android application module'
        required: true
        type: choice
        default: app
        options: [app]
      variant:
        description: 'Only the debug variant is accepted'
        required: true
        type: choice
        default: debug
        options: [debug]
      format:
        description: 'Installable LSPosed module package (APK only)'
        required: true
        type: choice
        default: apk
        options: [apk]
permissions:
  contents: read
concurrency:
  group: tg-speed-hook-devtool-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    name: Build and independently verify debug LSPosed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout requested Git commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check dispatch input and exact checked-out source
        shell: bash
        env:
          DT_PROJECT: ${{ inputs.project_dir }}
          DT_MODULE: ${{ inputs.module }}
          DT_VARIANT: ${{ inputs.variant }}
          DT_FORMAT: ${{ inputs.format }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$DT_PROJECT" = .
          test "$DT_MODULE" = app
          test "$DT_VARIANT" = debug
          test "$DT_FORMAT" = apk
          test -f app/build.gradle
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          python3 scripts/verify_telegram_speed_hook_actions.py --static
          python3 scripts/verify-toolchain.py
          python3 scripts/verify-modern-xposed.py
      - name: Prepare Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK 36 and NDK 29
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - name: Prepare Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build requested debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Verify modern libxposed APK and Android identity
        id: package
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" && test ! -L "$apk" && test -s "$apk"
          python3 scripts/verify-modern-xposed.py "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='Telegram.Speed.Hook'"
          stage="$RUNNER_TEMP/tsh-debug-apk"
          mkdir -p "$stage"
          cp -- "$apk" "$stage/telegram-speed-hook-debug.apk"
          python3 scripts/verify_telegram_speed_hook_actions.py --evidence "$stage/telegram-speed-hook-debug.apk" "$stage/build-evidence.json"
          sha256sum "$stage/telegram-speed-hook-debug.apk"
          echo "artifact_dir=$stage" >> "$GITHUB_OUTPUT"
      - name: Upload validated APK and evidence (no signing secrets)
        uses: actions/upload-artifact@v4
        with:
          name: telegram-speed-hook-debug-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.artifact_dir }}/
          if-no-files-found: error
          retention-days: 7
