# Devtool ACTIONS-05: fixed-choices GitHub-only Gradle dispatch. Do not change the 4 input names.
name: Telegram Speed Hook Devtool Android Build
on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: 'Checked-in project root'
        required: true
        type: choice
        default: '.'
        options: ['.']
      module:
        description: 'Checked-in application module'
        required: true
        type: choice
        default: app
        options: [app]
      variant:
        description: 'Debug only'
        required: true
        type: choice
        default: debug
        options: [debug]
      format:
        description: 'APK only'
        required: true
        type: choice
        default: apk
        options: [apk]
permissions:
  contents: read
concurrency:
  group: tg-speed-hook-devtool-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    name: Hosted verified debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout selected SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require fixed Devtool inputs before executing any Gradle operation
        shell: bash
        env:
          DT_PROJECT: ${{ inputs.project_dir }}
          DT_MODULE: ${{ inputs.module }}
          DT_VARIANT: ${{ inputs.variant }}
          DT_FORMAT: ${{ inputs.format }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$DT_PROJECT" = .
          test "$DT_MODULE" = app
          test "$DT_VARIANT" = debug
          test "$DT_FORMAT" = apk
      - name: Shared source/test/lint/package/receipt lane
        uses: ./.github/actions/verified-debug-build
