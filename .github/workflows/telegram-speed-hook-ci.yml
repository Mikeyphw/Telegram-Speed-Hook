# Every push/PR runs source contracts and hosted Android build. No release credentials.
name: Telegram Speed Hook CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      lane:
        description: 'CI lane'
        required: true
        type: choice
        default: all
        options: [all, source, android]
permissions:
  contents: read
concurrency:
  group: tg-speed-hook-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Read-only source contracts
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == 'source' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate checked-out source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/verify_telegram_speed_hook_actions.py --static
          python3 scripts/verify-toolchain.py
          python3 scripts/verify-modern-xposed.py
  android:
    name: Hosted Gradle, unit tests, lint, verified APK and receipt
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Shared hosted source/test/lint/package/receipt lane
        uses: ./.github/actions/verified-debug-build
