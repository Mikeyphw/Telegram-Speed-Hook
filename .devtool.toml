[project]
name = "Telegram-Speed-Hook"
type = "android"
repo = "git@github.com:Mikeyphw/Telegram-Speed-Hook.git"
root = "."
module = "app"

[android]
application_id = "Telegram.Speed.Hook"
namespace = "Telegram.Speed.Hook"
compile_sdk = 36
min_sdk = 26
target_sdk = 36
debug_apk = "app/build/outputs/apk/debug/app-debug.apk"

[extensions.xposed]
module_class = "Telegram.Speed.Hook.MainHook"
api_dependency = "io.github.libxposed:api:102.0.0"
min_api_version = 101
target_api_version = 102
metadata_dir = "app/src/main/resources/META-INF/xposed"
log_tag = "TgSpeedHook"

[extensions.xposed.scope]
telegram = "org.telegram.messenger"
nullgram = "top.qwq2333.nullgram"

[extensions.hook]
target_class = "org.telegram.messenger.FileLoadOperation"
target_method = "updateParams"
big_file_threshold_bytes = 5242880
download_chunk_size_big_bytes = 1048576
max_download_requests_big = 12

[extensions.checks.source]
description = "Verify modern libxposed API 102 packaging, hook safety, and toolchain floors"
command = """
set -eu
python3 scripts/verify-modern-xposed.py
python3 scripts/verify-toolchain.py
echo "Modern libxposed source and toolchain checks passed."
"""

[tasks.clean]
description = "Local Gradle clean disabled; use GitHub Actions for builds"
command = "python3 scripts/hosted_gradle_only.py"

[tasks.build_debug]
description = "Local Gradle build disabled; dispatch remote build with ./devtoolw remote-debug-build --yes"
command = "python3 scripts/hosted_gradle_only.py"

[tasks.verify]
description = "Verify source contracts without Gradle; APK verification happens in GitHub Actions"
command = "python3 scripts/verify-modern-xposed.py && python3 scripts/verify-toolchain.py"

[tasks.install_debug]
description = "Install debug APK on connected device"
command = "adb install -r app/build/outputs/apk/debug/app-debug.apk"

[tasks.force_stop_targets]
description = "Force-stop Telegram and Nullgram after enabling LSPosed scope"
command = """
adb shell am force-stop org.telegram.messenger || true
adb shell am force-stop top.qwq2333.nullgram || true
"""

[tasks.logs]
description = "Tail hook logs"
command = "adb logcat -v time | grep TgSpeedHook"

[tasks.release_check]
description = "Local Gradle release check disabled; no hosted release lane is configured"
command = "python3 scripts/hosted_gradle_only.py"

[artifacts]
debug_apk = "app/build/outputs/apk/debug/app-debug.apk"
source_hook = "app/src/main/java/Telegram/Speed/Hook/MainHook.java"
manifest = "app/src/main/AndroidManifest.xml"
xposed_metadata = "app/src/main/resources/META-INF/xposed"

[extensions.commands]
build = "python3 scripts/hosted_gradle_only.py"
check = "python3 scripts/verify-modern-xposed.py && python3 scripts/verify-toolchain.py"
install = "adb install -r app/build/outputs/apk/debug/app-debug.apk"
logs = "adb logcat -v time | grep TgSpeedHook"
# -----------------------------------------------------------------------------
# Devtool canonical target convergence (OV02)
# -----------------------------------------------------------------------------
[workspace]
default_target = "telegram_speed_hook"

[execution]
# Wave D: Devtool native Gradle execution is forbidden for this repository.
gradle_execution = "github-actions-only"
# All source-only workflows stay on the invoking host, including Termux.
environment = "host"
device_serial = ""

[targets.telegram_speed_hook]
runner = "android"
platform = "android"
root = "."
# Explicit host pin avoids Termux chrootctl auto-promotion.
execution_environment = "host"
inputs = [
  ".devtool.toml",
  "build.gradle",
  "settings.gradle",
  "gradle.properties",
  "gradle/wrapper/gradle-wrapper.properties",
  "gradlew",
  "gradle-termux",
  "app/**",
  "scripts/verify-modern-xposed.py",
  "scripts/verify-toolchain.py",
  "scripts/**",
  ".github/workflows/**",
  "docs/ci/**",
  "docs/WRAPPER.md",
  "docs/DEVTOOL_INTEGRATION_LEDGER.md",
]
outputs = [
  "app/build/outputs/apk/debug/app-debug.apk",
]

[targets.telegram_speed_hook.android]
variant = "debug"
aapt2_provider = "auto"
instrumentation = "when-device-present"
prefer_native_termux = true

[targets.telegram_speed_hook.gradle]
version = "9.7.1"
provider = "wrapper"
max_workers = 1
structured_events = true
no_daemon = true
parallel = false
build_cache = true
fail_fast = false
offline = false
args = [
  "-Dorg.gradle.parallel=false",
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
]

[targets.telegram_speed_hook.tasks]
restore = ["help"]
build = [":app:assembleDebug"]
test = [":app:testDebugUnitTest"]
lint = [":app:lintDebug"]
clean = ["clean"]

[targets.telegram_speed_hook.artifacts]
required = false
verify = false
paths = [
    "app/build/outputs/apk/debug/app-debug.apk",
]
recursive = true

[jobs.telegram-speed-hook-source-xposed]
runner = "python"
root = "."
execution_environment = "host"
command = ["python3", "scripts/verify-modern-xposed.py"]
inputs = [
  "app/build.gradle",
  "app/src/main/AndroidManifest.xml",
  "app/src/main/java/Telegram/Speed/Hook/MainHook.java",
  "app/proguard-rules.pro",
  "app/src/main/resources/META-INF/xposed/**",
  "scripts/verify-modern-xposed.py",
]
metadata = { read_only = true }

[jobs.telegram-speed-hook-toolchain]
runner = "python"
root = "."
execution_environment = "host"
command = ["python3", "scripts/verify-toolchain.py"]
inputs = [
  "build.gradle",
  "app/build.gradle",
  "gradle/wrapper/gradle-wrapper.properties",
  "scripts/verify-toolchain.py",
]
metadata = { read_only = true }

[jobs.telegram-speed-hook-packaged-xposed]
runner = "python"
root = "."
execution_environment = "host"
command = ["python3", "scripts/verify-modern-xposed.py", "app/build/outputs/apk/debug/app-debug.apk"]
inputs = [
  "app/build/outputs/apk/debug/app-debug.apk",
  "app/src/main/resources/META-INF/xposed/**",
  "scripts/verify-modern-xposed.py",
]
metadata = { read_only = true }

[targets.telegram_speed_hook.workflows]
restore = ["runner:android#restore"]
build = [
  "job:telegram-speed-hook-source-xposed",
  "job:telegram-speed-hook-toolchain",
  "runner:android#build",
]
test = ["runner:android#test"]
lint = ["runner:android#lint"]
package = [
  "runner:android#build",
  "job:telegram-speed-hook-packaged-xposed",
]
validate = [
  "job:telegram-speed-hook-source-xposed",
  "job:telegram-speed-hook-toolchain",
  "runner:android#build",
  "runner:android#test",
  "runner:android#lint",
  "job:telegram-speed-hook-packaged-xposed",
]
ci-preflight = [
  { id = "actions-contract", ref = "job:ci-actions-contract", depends_on = [] },
  { id = "source-contract", ref = "job:ci-source-contract", depends_on = ["actions-contract"] },
  { id = "wrapper-contract", ref = "job:ci-wrapper-contract", depends_on = ["source-contract"] },
  { id = "wave-b-contract", ref = "job:ci-wave-b-contract", depends_on = [] },
  { id = "wave-c-contract", ref = "job:ci-wave-c-contract", depends_on = [] },
  { id = "wave-d-policy", ref = "job:ci-wave-d-policy", depends_on = ["wave-c-contract"] },
  { id = "xposed-source", ref = "job:telegram-speed-hook-source-xposed", depends_on = [] },
]
ci-local = [
  { id = "wave-e-policy-tests", ref = "job:ci-wave-e-policy-tests", depends_on = [] },
  { id = "actions-contract", ref = "job:ci-actions-contract", depends_on = [] },
  { id = "source-contract", ref = "job:ci-source-contract", depends_on = ["actions-contract"] },
  { id = "wrapper-contract", ref = "job:ci-wrapper-contract", depends_on = ["source-contract"] },
  { id = "wave-b-contract", ref = "job:ci-wave-b-contract", depends_on = [] },
  { id = "wave-c-contract", ref = "job:ci-wave-c-contract", depends_on = [] },
  { id = "wave-d-policy", ref = "job:ci-wave-d-policy", depends_on = ["wave-c-contract"] },
  { id = "xposed-source", ref = "job:telegram-speed-hook-source-xposed", depends_on = [] },
  { id = "toolchain", ref = "job:telegram-speed-hook-toolchain", depends_on = [] },
]
ci-source = [
  { id = "wave-e-policy-tests", ref = "job:ci-wave-e-policy-tests", depends_on = [] },
  { id = "actions-contract", ref = "job:ci-actions-contract", depends_on = [] },
  { id = "source-contract", ref = "job:ci-source-contract", depends_on = ["actions-contract"] },
  { id = "wrapper-contract", ref = "job:ci-wrapper-contract", depends_on = ["source-contract"] },
  { id = "wave-b-contract", ref = "job:ci-wave-b-contract", depends_on = [] },
  { id = "wave-c-contract", ref = "job:ci-wave-c-contract", depends_on = [] },
  { id = "wave-d-policy", ref = "job:ci-wave-d-policy", depends_on = ["wave-c-contract"] },
  { id = "xposed-source", ref = "job:telegram-speed-hook-source-xposed", depends_on = [] },
  { id = "toolchain", ref = "job:telegram-speed-hook-toolchain", depends_on = [] },
]

[targets.telegram_speed_hook.jobs.ci-actions-contract]
runner = "command"
execution_environment = "host"
command = ["python3", "scripts/devtool_actions_contract.py"]
inputs = [".devtool.toml", ".github/workflows/**", ".github/actions/**", "scripts/devtool_actions_contract.py"]
metadata = { read_only = true }

[workspace.scheduler]
parallel = true
max_parallel_nodes = 2
max_gradle_nodes = 1
max_dotnet_nodes = 1

[wrapper]
schema = 2
default_command = "ci-source"

[wrapper.commands.ci-preflight]
description = "Portable read-only workflow/source contract checks"
workflow = "ci-preflight"
target = "telegram_speed_hook"

[wrapper.commands.ci-local]
description = "Portable Python-only source validation; never runs Gradle"
workflow = "ci-local"
target = "telegram_speed_hook"

[wrapper.commands.ci-source]
description = "Default local source and wrapper contract checks (no Gradle)"
workflow = "ci-source"
target = "telegram_speed_hook"

[wrapper.commands.validate]
description = "Alias for safe local ci-source (not the native Gradle validation runner)"
workflow = "ci-source"
target = "telegram_speed_hook"

[targets.telegram_speed_hook.jobs.ci-source-contract]
runner = "command"
execution_environment = "host"
command = ["python3", "scripts/verify_telegram_speed_hook_actions.py", "--static"]
inputs = [".devtool.toml", "scripts/verify_telegram_speed_hook_actions.py", "scripts/verify_wave_c.py", ".github/actions/**", ".github/workflows/**", "app/**", "build.gradle", "settings.gradle", "gradle.properties"]
metadata = { read_only = true }

[targets.telegram_speed_hook.jobs.ci-wrapper-contract]
runner = "command"
execution_environment = "host"
command = ["python3", "scripts/verify_devtool_wave_a.py"]
inputs = [".devtool.toml", "scripts/verify_devtool_wave_a.py", "scripts/hosted_gradle_only.py", "gradle-termux", "docs/**", "scripts/verify_devtool_wave_b.py"]
metadata = { read_only = true }

# GitHub-only Gradle: typed Actions shortcuts, no raw shell or passthrough.
# Default branch is fixed at the audited snapshot: main. For other refs,
# use `devtool actions plan/run ... --ref YOUR_PUSHED_BRANCH` explicitly.
[wrapper.commands.remote-debug-plan]
description = "Read-only GitHub debug APK plan with fixed dispatch inputs"
devtool = "actions"
[wrapper.commands.remote-debug-plan.actions]
operation = "plan"
workflow_id = "devtool-android-build.yml"
ref = "main"
[wrapper.commands.remote-debug-plan.actions.inputs]
project_dir = "."
module = "app"
variant = "debug"
format = "apk"

[wrapper.commands.remote-debug-build]
description = "Explicit GitHub debug APK dispatch; requires --yes"
devtool = "actions"
[wrapper.commands.remote-debug-build.actions]
operation = "dispatch"
workflow_id = "devtool-android-build.yml"
ref = "main"
[wrapper.commands.remote-debug-build.actions.inputs]
project_dir = "."
module = "app"
variant = "debug"
format = "apk"
[wrapper.commands.remote-debug-build.options.yes]
type = "boolean"
description = "Explicitly authorize GitHub workflow dispatch"
command_argv = ["--yes"]

[wrapper.commands.remote-watch]
description = "Watch the exact request; does not dispatch a new build"
devtool = "actions"
[wrapper.commands.remote-watch.actions]
operation = "watch"
[wrapper.commands.remote-watch.options.request_id]
type = "string"
required = true
aliases = ["request-id"]
command_argv = ["--request-id", "{value}"]

[wrapper.commands.remote-resume]
description = "Resume an existing dispatch request without a new POST"
devtool = "actions"
[wrapper.commands.remote-resume.actions]
operation = "resume"
[wrapper.commands.remote-resume.options.request_id]
type = "string"
required = true
aliases = ["request-id"]
command_argv = ["--request-id", "{value}"]

[wrapper.commands.remote-artifacts]
description = "List artifacts from the exact recorded dispatch request"
devtool = "actions"
[wrapper.commands.remote-artifacts.actions]
operation = "artifacts"
[wrapper.commands.remote-artifacts.options.request_id]
type = "string"
required = true
aliases = ["request-id"]
command_argv = ["--request-id", "{value}"]


[targets.telegram_speed_hook.jobs.ci-wave-b-contract]
runner = "command"
execution_environment = "host"
command = ["python3", "scripts/verify_devtool_wave_b.py"]
inputs = [".devtool.toml", "scripts/verify_devtool_wave_b.py", "scripts/verify_devtool_wave_a.py", "docs/ci/**"]
metadata = { read_only = true }

# Wave C: a strictly host-only, read-only contract for hosted shared builds.
[targets.telegram_speed_hook.jobs.ci-wave-c-contract]
runner = "command"
execution_environment = "host"
command = ["python3", "scripts/test_wave_c.py"]
inputs = [".github/workflows/**", ".github/actions/**", "scripts/verify_wave_c.py", "scripts/test_wave_c.py", "scripts/verify_wave_c_artifact.py", "scripts/verify_telegram_speed_hook_actions.py"]
metadata = { read_only = true }

# Wave D: enforce hosted-only source policy through an additional host-only check.
[targets.telegram_speed_hook.jobs.ci-wave-d-policy]
runner = "command"
execution_environment = "host"
command = ["python3", "scripts/verify_devtool_wave_d.py"]
inputs = [".devtool.toml", "scripts/verify_devtool_wave_d.py", "docs/ci/WAVE_D_HOSTED_POLICY.md"]
metadata = { read_only = true }

# Wave E — source-only checks of production JVM tests and hosted JUnit receipt.
[targets.telegram_speed_hook.jobs.ci-wave-e-policy-tests]
runner = "command"
execution_environment = "host"
command = ["python3", "scripts/test_wave_e.py"]
inputs = ["app/src/main/java/Telegram/Speed/Hook/**", "app/src/test/**", "app/build.gradle", "scripts/test_wave_e.py", "scripts/verify_junit_results.py", ".github/actions/**"]
metadata = { read_only = true }
