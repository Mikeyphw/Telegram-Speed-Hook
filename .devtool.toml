[project]
name = "Telegram-Speed-Hook"
type = "android"
repo = "git@github.com:Mikeyphw/Telegram-Speed-Hook.git"
root = "."
module = "app"

[android]
application_id = "Telegram.Speed.Hook"
namespace = "Telegram.Speed.Hook"
compile_sdk = 36
min_sdk = 26
target_sdk = 36
debug_apk = "app/build/outputs/apk/debug/app-debug.apk"

[extensions.xposed]
module_class = "Telegram.Speed.Hook.MainHook"
api_dependency = "io.github.libxposed:api:102.0.0"
min_api_version = 101
target_api_version = 102
metadata_dir = "app/src/main/resources/META-INF/xposed"
log_tag = "TgSpeedHook"

[extensions.xposed.scope]
telegram = "org.telegram.messenger"
nullgram = "top.qwq2333.nullgram"

[extensions.hook]
target_class = "org.telegram.messenger.FileLoadOperation"
target_method = "updateParams"
big_file_threshold_bytes = 5242880
download_chunk_size_big_bytes = 1048576
max_download_requests_big = 12

[extensions.checks.source]
description = "Verify modern libxposed API 102 packaging, hook safety, and toolchain floors"
command = """
set -eu
python3 scripts/verify-modern-xposed.py
python3 scripts/verify-toolchain.py
echo "Modern libxposed source and toolchain checks passed."
"""

[tasks.clean]
description = "Clean Gradle outputs"
command = "./gradle-termux clean"

[tasks.build_debug]
description = "Build debug APK"
command = "./gradle-termux :app:assembleDebug"

[tasks.verify]
description = "Verify source contract, build APK, then verify packaged module metadata"
command = """
set -eu
python3 scripts/verify-modern-xposed.py
python3 scripts/verify-toolchain.py
./gradle-termux :app:assembleDebug
python3 scripts/verify-modern-xposed.py app/build/outputs/apk/debug/app-debug.apk
"""

[tasks.install_debug]
description = "Install debug APK on connected device"
command = "adb install -r app/build/outputs/apk/debug/app-debug.apk"

[tasks.force_stop_targets]
description = "Force-stop Telegram and Nullgram after enabling LSPosed scope"
command = """
adb shell am force-stop org.telegram.messenger || true
adb shell am force-stop top.qwq2333.nullgram || true
"""

[tasks.logs]
description = "Tail hook logs"
command = "adb logcat -v time | grep TgSpeedHook"

[tasks.release_check]
description = "Full local release sanity check"
command = """
set -eu
python3 scripts/verify-modern-xposed.py
python3 scripts/verify-toolchain.py
./gradle-termux clean :app:assembleDebug
python3 scripts/verify-modern-xposed.py app/build/outputs/apk/debug/app-debug.apk
ls -lh app/build/outputs/apk/debug/app-debug.apk
"""

[artifacts]
debug_apk = "app/build/outputs/apk/debug/app-debug.apk"
source_hook = "app/src/main/java/Telegram/Speed/Hook/MainHook.java"
manifest = "app/src/main/AndroidManifest.xml"
xposed_metadata = "app/src/main/resources/META-INF/xposed"

[extensions.commands]
build = "./gradle-termux :app:assembleDebug"
check = "python3 scripts/verify-modern-xposed.py && python3 scripts/verify-toolchain.py && ./gradle-termux :app:assembleDebug && python3 scripts/verify-modern-xposed.py app/build/outputs/apk/debug/app-debug.apk"
install = "adb install -r app/build/outputs/apk/debug/app-debug.apk"
logs = "adb logcat -v time | grep TgSpeedHook"
# -----------------------------------------------------------------------------
# Devtool canonical target convergence (OV02)
# -----------------------------------------------------------------------------
[workspace]
default_target = "telegram_speed_hook"

[execution]
environment = "auto"
chroot_name = "androidos"
device_serial = ""

[targets.telegram_speed_hook]
runner = "android"
platform = "android"
root = "."
execution_environment = "native-termux"
chroot_name = "androidos"
inputs = [
  ".devtool.toml",
  "build.gradle",
  "settings.gradle",
  "gradle.properties",
  "gradle/wrapper/gradle-wrapper.properties",
  "gradlew",
  "gradle-termux",
  "app/**",
  "scripts/verify-modern-xposed.py",
  "scripts/verify-toolchain.py",
]
outputs = [
  "app/build/outputs/apk/debug/app-debug.apk",
]

[targets.telegram_speed_hook.android]
variant = "debug"
aapt2_provider = "auto"
instrumentation = "when-device-present"
prefer_native_termux = true

[targets.telegram_speed_hook.gradle]
version = "9.7.1"
provider = "wrapper"
max_workers = 1
structured_events = true
no_daemon = true
parallel = false
build_cache = true
fail_fast = false
offline = false
args = [
  "-Dorg.gradle.parallel=false",
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
]

[targets.telegram_speed_hook.tasks]
restore = ["help"]
build = [":app:assembleDebug"]
test = [":app:testDebugUnitTest"]
lint = [":app:lintDebug"]
clean = ["clean"]

[targets.telegram_speed_hook.artifacts]
required = false
verify = false
paths = [
    "app/build/outputs/apk/debug/app-debug.apk",
]
recursive = true

[jobs.telegram-speed-hook-source-xposed]
runner = "python"
root = "."
execution_environment = "native-termux"
command = ["python3", "scripts/verify-modern-xposed.py"]
inputs = [
  "app/build.gradle",
  "app/src/main/AndroidManifest.xml",
  "app/src/main/java/Telegram/Speed/Hook/MainHook.java",
  "app/proguard-rules.pro",
  "app/src/main/resources/META-INF/xposed/**",
  "scripts/verify-modern-xposed.py",
]

[jobs.telegram-speed-hook-toolchain]
runner = "python"
root = "."
execution_environment = "native-termux"
command = ["python3", "scripts/verify-toolchain.py"]
inputs = [
  "build.gradle",
  "app/build.gradle",
  "gradle/wrapper/gradle-wrapper.properties",
  "scripts/verify-toolchain.py",
]

[jobs.telegram-speed-hook-packaged-xposed]
runner = "python"
root = "."
execution_environment = "native-termux"
command = ["python3", "scripts/verify-modern-xposed.py", "app/build/outputs/apk/debug/app-debug.apk"]
inputs = [
  "app/build/outputs/apk/debug/app-debug.apk",
  "app/src/main/resources/META-INF/xposed/**",
  "scripts/verify-modern-xposed.py",
]
outputs = ["app/build/outputs/apk/debug/app-debug.apk"]

[targets.telegram_speed_hook.workflows]
restore = ["runner:android#restore"]
build = [
  "job:telegram-speed-hook-source-xposed",
  "job:telegram-speed-hook-toolchain",
  "runner:android#build",
]
test = ["runner:android#test"]
lint = ["runner:android#lint"]
package = [
  "runner:android#build",
  "job:telegram-speed-hook-packaged-xposed",
]
validate = [
  "job:telegram-speed-hook-source-xposed",
  "job:telegram-speed-hook-toolchain",
  "runner:android#build",
  "runner:android#test",
  "runner:android#lint",
  "job:telegram-speed-hook-packaged-xposed",
]
ci-preflight = [
  { id = "actions-contract", ref = "job:ci-actions-contract", depends_on = [] },
  { id = "source-contract", ref = "job:ci-source-contract", depends_on = ["actions-contract"] },
  { id = "xposed-source", ref = "job:telegram-speed-hook-source-xposed", depends_on = [] },
]
ci-local = [
  { id = "actions-contract", ref = "job:ci-actions-contract", depends_on = [] },
  { id = "source-contract", ref = "job:ci-source-contract", depends_on = ["actions-contract"] },
  { id = "xposed-source", ref = "job:telegram-speed-hook-source-xposed", depends_on = [] },
  { id = "toolchain", ref = "job:telegram-speed-hook-toolchain", depends_on = ["xposed-source", "source-contract"] },
  { id = "unit", ref = "runner:android#test", depends_on = ["toolchain", "actions-contract"] },
  { id = "lint", ref = "runner:android#lint", depends_on = ["toolchain", "actions-contract"] },
]
ci-source = [
  { id = "actions-contract", ref = "job:ci-actions-contract", depends_on = [] },
  { id = "source-contract", ref = "job:ci-source-contract", depends_on = ["actions-contract"] },
]

[targets.telegram_speed_hook.jobs.ci-actions-contract]
runner = "command"
command = ["python3", "scripts/devtool_actions_contract.py"]
inputs = [".devtool.toml", ".github/workflows/*.yml", "scripts/devtool_actions_contract.py"]
metadata = { read_only = true }

[workspace.scheduler]
parallel = true
max_parallel_nodes = 2
max_gradle_nodes = 1
max_dotnet_nodes = 1

[wrapper]
schema = 2
default_command = "build"

[wrapper.commands.build]
description = "build through canonical Devtool and EXO"
devtool = "build"
target = "telegram_speed_hook"
allow_passthrough = true

[wrapper.commands.test]
description = "test through canonical Devtool and EXO"
devtool = "test"
target = "telegram_speed_hook"
allow_passthrough = true

[wrapper.commands.lint]
description = "lint through canonical Devtool and EXO"
devtool = "lint"
target = "telegram_speed_hook"
allow_passthrough = true

[wrapper.commands.package]
description = "package through canonical Devtool and EXO"
devtool = "package"
target = "telegram_speed_hook"
allow_passthrough = true

[wrapper.commands.validate]
description = "validate through canonical Devtool and EXO"
workflow = "validate"
target = "telegram_speed_hook"

[wrapper.commands.ci-preflight]
description = "ci-preflight through canonical Devtool and EXO"
workflow = "ci-preflight"
target = "telegram_speed_hook"

[wrapper.commands.ci-local]
description = "ci-local through canonical Devtool and EXO"
workflow = "ci-local"
target = "telegram_speed_hook"

[targets.telegram_speed_hook.jobs.ci-source-contract]
runner = "command"
command = ["python3", "scripts/verify_telegram_speed_hook_actions.py", "--static"]
inputs = [".devtool.toml", "scripts/verify_telegram_speed_hook_actions.py", ".github/workflows/*.yml"]
metadata = { read_only = true }

[wrapper.commands.ci-source]
description = "Read-only project-specific source and CI contract with EXO evidence"
workflow = "ci-source"
target = "telegram_speed_hook"
