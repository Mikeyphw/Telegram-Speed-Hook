pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Toolchain policy: these are minimum baselines, not exact ceilings.
import org.gradle.util.GradleVersion

if (GradleVersion.current() < GradleVersion.version("9.7")) {
    throw new GradleException("Telegram-Speed-Hook requires Gradle 9.7 or newer")
}
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
    throw new GradleException("Telegram-Speed-Hook requires Java 21 or newer")
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Telegram-Speed-Hook"
include ':app'
