pluginManagement {
    repositories {
        google()

        // Alternate Maven Central endpoint. Useful on Termux when
        // repo.maven.apache.org is temporarily unreachable/stalling.
        mavenCentral()

        mavenCentral()
        gradlePluginPortal()
    }
}

// Toolchain policy: chrootctl is the minimum baseline, not an exact ceiling.
import org.gradle.util.GradleVersion

if (GradleVersion.current() < GradleVersion.version("9.7")) {
    throw new GradleException("Telegram-Speed-Hook requires Gradle 9.7 or newer")
}
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
    throw new GradleException("Telegram-Speed-Hook requires Java 21 or newer")
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url = uri("https://api.xposed.info/") }
        google()

        // Alternate Maven Central endpoint before the canonical one.
        mavenCentral()

        mavenCentral()
    }
}

rootProject.name = "Telegram-Speed-Hook"
include ':app'
