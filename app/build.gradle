plugins {
    id 'com.android.application'
}

android {
    namespace "Telegram.Speed.Hook"

    // Keep Telegram-Speed-Hook at least at the repository Android baseline.
    compileSdk 36
    buildToolsVersion "36.0.0"

    // NDK r29 is the minimum accepted native toolchain. This Java-only module
    // currently has no JNI/CMake payload, but pinning r29 makes future native
    // additions deterministic and the verifier rejects any downgrade below 29.
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "Telegram.Speed.Hook"
        // libxposed API 102.0.0 itself declares minSdk 26.
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Modern libxposed API. compileOnly is required: the framework provides
    // these classes inside the hooked target process and they must not be
    // packaged into the module APK.
    compileOnly 'io.github.libxposed:api:102.0.0'
}
